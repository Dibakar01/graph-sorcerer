<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1200" height="400" fill="#ffffff"/>
  <defs>
    <marker id="aL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7a6a68"/>
    </marker>
    <marker id="oL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#d92819"/>
    </marker>
    <marker id="dL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#a89896"/>
    </marker>
  </defs>

  <!-- the job -->
  <rect x="46" y="168" width="150" height="64" rx="6" fill="none" stroke="#1a1211" stroke-width="2"/>
  <text x="121" y="196" fill="#1a1211" font-size="14" text-anchor="middle">your job</text>
  <text x="121" y="215" fill="#7a6a68" font-size="11" text-anchor="middle">N things to do</text>
  <path d="M200 200 H262" stroke="#7a6a68" stroke-width="2" fill="none" marker-end="url(#aL)"/>

  <!-- gate -->
  <path d="M348 152 L410 200 L348 248 L286 200 Z" fill="none" stroke="#d92819" stroke-width="2.5"/>
  <text x="348" y="196" fill="#d92819" font-size="12.5" text-anchor="middle" font-weight="700">GATE</text>
  <text x="348" y="213" fill="#d92819" font-size="10.5" text-anchor="middle">fake-edge</text>
  <text x="348" y="285" fill="#7a6a68" font-size="11" text-anchor="middle">does B need A's result?</text>

  <!-- branch up: build -->
  <path d="M410 186 C 452 186, 452 116, 494 116" stroke="#d92819" stroke-width="2" fill="none" marker-end="url(#oL)"/>
  <text x="452" y="100" fill="#d92819" font-size="10.5" text-anchor="middle" letter-spacing="1.2">NO EDGE</text>

  <!-- graph cluster -->
  <rect x="502" y="94" width="74" height="44" rx="5" fill="none" stroke="#d92819" stroke-width="2"/>
  <text x="539" y="121" fill="#d92819" font-size="11.5" text-anchor="middle">split</text>
  <g stroke="#d92819" stroke-width="1.8" fill="none">
    <path d="M576 116 C 606 116, 610 58, 640 58" marker-end="url(#oL)"/>
    <path d="M576 116 C 606 116, 610 96, 640 96" marker-end="url(#oL)"/>
    <path d="M576 116 C 606 116, 610 136, 640 136" marker-end="url(#oL)"/>
    <path d="M576 116 C 606 116, 610 174, 640 174" marker-end="url(#oL)"/>
  </g>
  <g fill="none" stroke="#d92819" stroke-width="2">
    <rect x="648" y="42" width="66" height="32" rx="5"/><rect x="648" y="80" width="66" height="32" rx="5"/>
    <rect x="648" y="120" width="66" height="32" rx="5"/><rect x="648" y="158" width="66" height="32" rx="5"/>
  </g>
  <g fill="#d92819" font-size="10.5" text-anchor="middle">
    <text x="681" y="62">worker</text><text x="681" y="100">worker</text>
    <text x="681" y="140">worker</text><text x="681" y="178">worker</text>
  </g>
  <g stroke="#d92819" stroke-width="1.8" fill="none">
    <path d="M714 58 C 744 58, 748 116, 778 116" marker-end="url(#oL)"/>
    <path d="M714 96 C 744 96, 748 116, 778 116" marker-end="url(#oL)"/>
    <path d="M714 136 C 744 136, 748 116, 778 116" marker-end="url(#oL)"/>
    <path d="M714 174 C 744 174, 748 116, 778 116" marker-end="url(#oL)"/>
  </g>
  <rect x="786" y="94" width="86" height="44" rx="5" fill="none" stroke="#d92819" stroke-width="2"/>
  <text x="829" y="115" fill="#d92819" font-size="11" text-anchor="middle">verify</text>
  <text x="829" y="130" fill="#d92819" font-size="11" text-anchor="middle">+ merge</text>
  <path d="M872 116 H 916" stroke="#d92819" stroke-width="2" fill="none" marker-end="url(#oL)"/>
  <text x="1010" y="112" fill="#1a1211" font-size="14" font-weight="700">builds the graph</text>
  <text x="1010" y="132" fill="#7a6a68" font-size="11">capped · verified · gated</text>

  <!-- branch down: refuse -->
  <path d="M410 214 C 452 214, 452 306, 494 306" stroke="#a89896" stroke-width="2" fill="none" marker-end="url(#dL)"/>
  <text x="452" y="342" fill="#a89896" font-size="10.5" text-anchor="middle" letter-spacing="1.2">REAL EDGE</text>
  <circle cx="556" cy="306" r="30" fill="none" stroke="#a89896" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M556 276 A 30 30 0 1 1 530 292" fill="none" stroke="#a89896" stroke-width="2" marker-end="url(#dL)"/>
  <text x="556" y="311" fill="#a89896" font-size="10.5" text-anchor="middle">loop</text>
  <path d="M596 306 H 640" stroke="#a89896" stroke-width="2" fill="none" marker-end="url(#dL)"/>
  <text x="656" y="302" fill="#1a1211" font-size="14" font-weight="700">refuses — and says why</text>
  <text x="656" y="322" fill="#7a6a68" font-size="11">one agent is faster and cheaper here</text>
</svg>
