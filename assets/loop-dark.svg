<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="You describe a job. The gate either stops there and says why, or produces a design. You review it, loop back with changes, and only your green signal starts the run."><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8b7c79"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#5c534f"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#f4614e"/></marker></defs><rect width="1200" height="300" fill="#0d1117"/><rect x="30" y="102" width="140" height="52" rx="5" fill="none" stroke="#413734" stroke-width="1.8"/><text x="100" y="133" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#8b7c79">you describe a job</text><path d="M176 128 H 200" stroke="#8b7c79" stroke-width="1.8" fill="none" marker-end="url(#m)"/><path d="M252 88 L298 128 L252 168 L206 128 Z" fill="none" stroke="#f4614e" stroke-width="2.2"/><text x="252" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#f4614e">GATE</text><text x="252" y="143" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#f4614e">fake-edge</text><path d="M252 172 V 214" stroke="#5c534f" stroke-width="1.8" fill="none" marker-end="url(#g)"/><rect x="152" y="220" width="200" height="42" rx="5" fill="none" stroke="#5c534f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="252" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospa