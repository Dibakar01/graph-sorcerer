<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Break-even in tokens. One wrongly fanned-out job of eight agents at fifteen thousand tokens each wastes 105,000 tokens. The plugin costs 130 tokens per session, a hairline on the same scale — so one prevented fan-out covers roughly 800 sessions."><rect width="1200" height="430" fill="#ffffff"/><text x="60" y="46" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#7a6a68">BREAK-EVEN, IN TOKENS</text><text x="60" y="124" text-anchor="start" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#d92819">~800 sessions</text><text x="60" y="166" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#7a6a68">of the plugin&#39;s always-on cost are covered by <tspan font-weight="600" fill="#1a1211">one</tspan> fan-out it correctly declines.</text><text x="60" y="214" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#7a6a68">one wrongly fanned-out job — 8 agents x 15k tokens, on work that had to run in order</text><rect x="60" y="224" width="1080" height="26" rx="3" fill="#f4eeed"/><rect x="60" y="224" width="1080" height="26" rx="3" fill="#d92819" opacity=".18"/><text x="1140" y="242" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#7a6a68">105,000 tok wasted</text><text x="60" y="284" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#7a6a68">the plugin, for one session — same scale</text><rect x="60" y="294" width="1080" height="26" rx="3" fill="#f4eeed"/><rect x="60" y="294" width="1.34" height="26" fill="#d92819"/><path d="M61 326 V 340 H 150" stroke="#d92819" stroke-width="1.5" fill="none"/><text x="158" y="344" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#d92819">130 tok — the hairline at the left edge</text><line x1="60" y1="378" x2="1140" y2="378" stroke="#ebe0de" stroke-width="1"/><text x="60" y="404" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#a89896">N agents on work whose steps depend on each other produce one agent&#39;s worth of progress, so (N-1) x T tokens are wasted.</text><text x="60" y="422" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#a89896">Swap in your own N and T. Run bench/run.sh to measure against your own workload.</text></svg>