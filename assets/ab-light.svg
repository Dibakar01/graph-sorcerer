<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="The same request, two outcomes. Without the plugin, eight agents spawn on work whose steps depend on each other. With it, the gate finds no independent pair and declines, leaving one agent."><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#b9adab"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#d92819"/></marker></defs><rect width="1200" height="560" fill="#ffffff"/><line x1="600" y1="40" x2="600" y2="520" stroke="#ebe0de" stroke-width="1"/><text x="48" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.6" fill="#7a6a68">WITHOUT IT</text><rect x="48" y="88" width="504" height="72" rx="5" fill="none" stroke="#ebe0de" stroke-width="1.5"/><text x="68" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a6a68">"fix the failing test in auth.spec.ts —</text><text x="68" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a6a68">run it in parallel so it&#39;s quick"</text><path d="M300 164 V 196" stroke="#b9adab" stroke-width="1.6" marker-end="url(#g)"/><rect x="48" y="214" width="108" height="46" rx="4" fill="none" stroke="#b9adab" stroke-width="1.5"/><text x="102" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#b9adab">agent 1</text><rect x="180" y="214" width="108" height="46" rx="4" fill="none" stroke="#b9adab" stroke-width="1.5"/><text x="234" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#b9adab">agent 2</text><rect x="312" y="214" width="108" height="46" rx="4" fill="none" stroke="#b9adab" stroke-width="1.5"/><text x="366" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#b9adab">agent 3</text><rect x="444" y="214" width="108" height="46" rx="4" fill="none" stroke="#b9adab" stroke-width="1.5"/><text x="498" y="242" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#b9adab">agent 4</text><rect x="48" y="276" width="108" height="46" rx="4" fill="none" stroke="#b9adab" stroke-width="1.5"/><text x="102" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#b9adab">agent 5</text><rect x="180" y="276" width="108" height="46" rx="4" fill="none" stroke="#b9adab" stroke-width="1.5"/><text x="234" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#b9adab">agent 6</text><rect x="312" y="276" width="108" height="46" rx="4" fill="none" stroke="#b9adab" stroke-width="1.5"/><text x="366" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#b9adab">agent 7</text><rect x="444" y="276" width="108" height="46" rx="4" fill="none" stroke="#b9adab" stroke-width="1.5"/><text x="498" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#b9adab">agent 8</text><text x="300" y="372" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1a1211">8 agents spawned</text><text x="300" y="404" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a6a68">on work whose every step needs the last one&#39;s result</text><rect x="48" y="432" width="504" height="60" rx="4" fill="#f7f2f1"/><text x="300" y="459" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a6a68">You paid for breadth that was never there.</text><text x="300" y="479" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a6a68">Same answer, longer wait, bigger bill.</text><text x="648" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.6" fill="#d92819">WITH IT</text><rect x="648" y="88" width="504" height="72" rx="5" fill="none" stroke="#ebe0de" stroke-width="1.5"/><text x="668" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a6a68">"fix the failing test in auth.spec.ts —</text><text x="668" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7a6a68">run it in parallel so it&#39;s quick"</text><path d="M900 164 V 190" stroke="#d92819" stroke-width="1.8" marker-end="url(#r)"/><path d="M900 192 L 966 236 L 900 280 L 834 236 Z" fill="none" stroke="#d92819" stroke-width="2.2"/><text x="900" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#d92819">GATE</text><text x="900" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#d92819">fake-edge</text><text x="900" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#7a6a68">no two jobs are independent</text><path d="M900 314 V 332" stroke="#d92819" stroke-width="1.8" marker-end="url(#r)"/><rect x="830" y="330" width="140" height="46" rx="4" fill="none" stroke="#d92819" stroke-width="2"/><text x="900" y="358" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#d92819">1 agent</text><text x="900" y="418" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1a1211">It declines.</text><rect x="648" y="432" width="504" height="60" rx="4" fill="#fdeae7"/><text x="900" y="459" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#d92819">"read → diagnose → fix → re-run is a loop.</text><text x="900" y="479" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#d92819">One agent is faster and cheaper here."</text></svg>